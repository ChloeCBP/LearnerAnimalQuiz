<style>
  :root{
    --ink:#1E0E4B;            /* Prisma warm black */
    --purple:#7224F9;         /* Prisma purple */
    --mint:#55EFAE;           /* Prisma mint */
    --paper:#FBFAFF;
    --panel:#FFFFFF;
    --line:#E9E4FA;
    --ink-soft:#6A6391;
    /* eight animal hues, from the Prisma accent palette */
    --dolphin:#2BC99A;        /* mint-green, deepened for contrast */
    --fox:#F5933E;            /* orange */
    --otter:#F594B7;          /* pink */
    --wolf:#7224F9;           /* purple */
    --bear:#C47C58;           /* burnt orange */
    --leopard:#BC63D4;        /* fuchsia */
    --redpanda:#D9649F;       /* raspberry */
    --crow:#127688;           /* teal */
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --body:'Nunito', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}

  /* ---------- split layout ---------- */
  .app{display:flex;min-height:100vh;}
  .brand{
    flex:0 0 42%;max-width:560px;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(150deg,#7224F9 0%, #9B3BE8 48%, #BC63D4 100%);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:40px 44px;
  }
  .brand::after{ /* soft mint glow */
    content:"";position:absolute;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle, rgba(85,239,174,.35), transparent 70%);
    right:-120px;top:-100px;pointer-events:none;
  }
  .wordmark{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
  .wordmark .logo{height:30px;width:auto;display:block;}
  .wordmark span{font-family:var(--display);font-weight:600;font-size:1.05rem;opacity:.72;}
  .brand-mid{position:relative;z-index:1;}
  .headline{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.04;letter-spacing:-.025em;margin-bottom:16px;}
  .brand-mid p{font-size:1.06rem;color:rgba(255,255,255,.86);max-width:34ch;}
  .brand-bottom{position:relative;z-index:1;}
  .progress{height:8px;width:100%;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;}
  .progress .fill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--wolf),var(--leopard),var(--redpanda),var(--otter),var(--bear),var(--fox),var(--dolphin),var(--crow));
    transition:width .45s cubic-bezier(.22,.61,.36,1);}
  .progress-label{font-size:.8rem;color:rgba(255,255,255,.8);margin-top:9px;font-weight:600;letter-spacing:.02em;}
  @media (prefers-reduced-motion: reduce){ .progress .fill{transition:none;} }

  .panel{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:48px 40px;min-width:0;}
  .card{width:100%;max-width:600px;}

  /* ---------- shared UI ---------- */
  .step-count{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:12px;}
  h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.08;letter-spacing:-.02em;margin-bottom:8px;}
  p.lede{color:var(--ink-soft);font-size:1.08rem;margin-bottom:26px;}

  label.field{display:block;margin-bottom:16px;}
  label.field > span.lab{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px;}
  input[type=text], input[type=email], select{
    width:100%;font-family:var(--body);font-size:1rem;color:var(--ink);font-weight:500;
    padding:13px 14px;border:2px solid var(--line);border-radius:13px;background:#fff;
  }
  input::placeholder{color:#B3ADCB;}
  input:focus, select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(114,36,249,.14);}

  .choices{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .choice{
    text-align:left;font-family:var(--body);font-size:1.1rem;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 22px;cursor:pointer;
    transition:border-color .14s, background .14s, transform .07s;display:flex;align-items:center;gap:16px;
  }
  .choice:hover{border-color:var(--purple);background:#FAF7FF;}
  .choice:active{transform:scale(.99);}
  .choice:focus-visible{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(114,36,249,.14);}
  .choice .pip{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);}
  .choice:hover .pip{border-color:var(--purple);}

  .q-stem{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.14;letter-spacing:-.015em;margin-bottom:6px;}

  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{font-family:var(--body);font-size:.98rem;font-weight:600;padding:10px 16px;border-radius:999px;
    border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);transition:all .12s;}
  .chip[aria-pressed="true"]{background:var(--purple);color:#fff;border-color:var(--purple);}
  .chip:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(114,36,249,.14);}

  .seg{display:flex;flex-direction:column;gap:10px;}
  .seg button{font-family:var(--body);font-size:1.05rem;font-weight:600;text-align:left;
    padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);}
  .seg button[aria-pressed="true"]{border-color:var(--purple);background:#FAF7FF;}
  .seg button:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(114,36,249,.14);}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px;}
  .btn{font-family:var(--display);font-weight:700;font-size:1.02rem;padding:14px 30px;border-radius:999px;border:none;cursor:pointer;}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-primary:hover{background:#5e17e0;}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:14px 10px;font-family:var(--body);font-weight:700;}
  .btn-ghost:hover{color:var(--ink);}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(114,36,249,.2);}
  .hint{font-size:.84rem;color:var(--ink-soft);}
  .err{color:#D9377B;font-size:.9rem;margin-top:8px;font-weight:700;}

  /* ---------- reveal ---------- */
  .reveal{text-align:center;}
  .badge{width:132px;height:132px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:66px;
    background:radial-gradient(circle at 32% 30%, color-mix(in srgb,var(--accent) 20%, #fff), color-mix(in srgb,var(--accent) 52%, #fff));
    border:3px solid color-mix(in srgb,var(--accent) 55%, #fff);box-shadow:0 18px 44px -18px var(--accent);
    animation:pop .6s cubic-bezier(.22,1.2,.36,1);overflow:hidden;}
  @keyframes pop{from{transform:scale(.62);opacity:0;}to{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .badge{animation:none;} }
  .reveal .you-are{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .reveal h1{font-family:var(--display);font-weight:800;font-size:2.8rem;letter-spacing:-.02em;margin:4px 0 2px;color:var(--accent);}
  .reveal .func{font-size:.98rem;color:var(--ink-soft);font-weight:700;margin-bottom:18px;}
  .reveal .desc{font-size:1.1rem;max-width:48ch;margin:0 auto;}
  .power-tag{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:10px 18px;border-radius:999px;
    background:color-mix(in srgb,var(--accent) 12%, #fff);color:color-mix(in srgb,var(--accent) 82%, #000);
    font-weight:700;font-size:.95rem;border:2px solid color-mix(in srgb,var(--accent) 28%, #fff);}
  .opp{margin-top:18px;font-size:.95rem;color:var(--ink-soft);}
  .done-note{margin-top:24px;padding:16px;border-radius:14px;background:#F3F0FF;color:var(--ink-soft);font-size:.95rem;font-weight:600;}

  /* ---------- learn more about your animal (on reveal) ---------- */
  .learn-btn{display:inline-block;margin-top:22px;text-decoration:none;
    font-family:var(--display);font-weight:700;font-size:1.02rem;padding:14px 28px;border-radius:999px;
    color:#fff;background:var(--accent);transition:filter .14s;}
  .learn-btn:hover{filter:brightness(.92);}
  .learn-btn:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%, transparent);}

  /* ---------- responsive ---------- */
  @media (max-width: 900px){
    .app{flex-direction:column;}
    .brand{flex:0 0 auto;max-width:none;padding:22px 24px;}
    .brand-mid .headline{font-size:1.9rem;margin-bottom:8px;}
    .brand-mid .headline, .brand-mid p{display:none;}
    .brand-bottom{margin-top:16px;}
    .panel{padding:32px 22px;}
    h2{font-size:1.7rem;}
    .q-stem{font-size:1.45rem;}
  }
</style>
</head>

              b:["I","You'd rather hang out with one or two close friends.","You'd rather spend time with a couple of close friends."]},
  {axis:"EI", a:["E","When you have great news, you want to tell everyone right away.","Big news hits and you broadcast it immediately."],
              b:["I","When you have great news, you sit with it yourself first, then share.","Big news hits and you process it privately first."]},
  {axis:"EI", a:["E","To recharge after a long day, you find someone to talk or play with.","You recharge by being around people."],
              b:["I","To recharge after a long day, you spend time on your own.","You recharge by getting time alone."]},
  {axis:"EI", a:["E","In a workshop you usually raise your hand and think out loud.","You do your best thinking out loud, bouncing ideas off people."],
              b:["I","In a workshop you usually work it out in your head first.","You do your best thinking alone, before sharing."]},
  {axis:"EI", a:["E","On a project, you'd rather team up with others.","On a project, you'd rather collaborate closely with a team."],
              b:["I","On a project, you'd rather do your part on your own.","On a project, you'd rather own a piece independently."]},
  {axis:"EI", a:["E","A perfect Friday night is out doing something with friends.","Your ideal Friday night is out with friends."],
              b:["I","A perfect Friday night is cozy at home with a book, game, or show.","Your ideal Friday night is a low-key night to yourself."]},

  {axis:"SN", a:["S","You're more interested in what's real and happening right now.","You're drawn more to concrete, practical realities."],
              b:["N","You're more interested in what could be possible, and “what ifs.”","You're drawn more to theories and possibilities."]},
  {axis:"SN", a:["S","When you learn something new, you like clear steps and real examples.","Learning something new, you want concrete steps and examples."],
              b:["N","When you learn something new, you like the big idea and how it connects.","Learning something new, you want the overarching concept."]},
  {axis:"SN", a:["S","You'd rather a coach show you exactly how.","You'd rather a workshop give you clear methods."],
              b:["N","You'd rather a coach let you find your own way.","You'd rather a workshop hand you an open problem to crack."]},
  {axis:"SN", a:["S","You tend to notice the little details around you.","You naturally pick up on specific details."],
              b:["N","You tend to notice patterns and how things fit together.","You naturally pick up on patterns and connections."]},
  {axis:"SN", a:["S","Your daydreams are usually about things you did or will do soon.","Your mind wanders to real, near-term plans."],
              b:["N","Your daydreams are usually about wild imaginary worlds and ideas.","Your mind wanders to abstract ideas and what-ifs."]},
  {axis:"SN", a:["S","You trust something more when you can see, touch, or test it.","You trust something more when it's been tested in practice."],
              b:["N","You trust something more when it makes sense as an idea.","You trust something more when it's logically sound in theory."]},
  {axis:"SN", a:["S","You'd rather read about real people and true stories.","You'd rather read nonfiction and real accounts."],
              b:["N","You'd rather read about made-up worlds and possibilities.","You'd rather read speculative or idea-driven writing."]},

  {axis:"TF", a:["T","When a friend has a problem, you first help them find a solution.","A friend brings a problem; you first help them solve it."],
              b:["F","When a friend has a problem, you first make sure they feel heard.","A friend brings a problem; you first make sure they feel heard."]},
  {axis:"TF", a:["T","The worse thing to be called is unfair.","Worse to be called: unfair."],
              b:["F","The worse thing to be called is unkind.","Worse to be called: unkind."]},
  {axis:"TF", a:["T","When deciding something, you trust logic and facts.","On a tough call, you lean on objective logic."],
              b:["F","When deciding something, you trust how people will feel.","On a tough call, you lean on the human impact."]},
  {axis:"TF", a:["T","In a group project, it matters more that the work is done right.","In a team, you weight getting it right more."],
              b:["F","In a group project, it matters more that everyone gets along.","In a team, you weight group harmony more."]},
  {axis:"TF", a:["T","If a rule seems off, you care most about whether it makes sense.","When a rule seems off, you focus on whether it's logical."],
              b:["F","If a rule seems off, you care most about who it might hurt.","When a rule seems off, you focus on who it affects."]},
  {axis:"TF", a:["T","Giving feedback to a friend, you tell them straight so they can improve.","Giving feedback, you tend to be direct and honest."],
              b:["F","Giving feedback to a friend, you soften it so you don't hurt their feelings.","Giving feedback, you tend to be gentle and tactful."]},
  {axis:"TF", a:["T","A good leader most needs to be fair and consistent.","A great leader is above all fair and principled."],
              b:["F","A good leader most needs to be caring and understanding.","A great leader is above all empathetic."]},

  {axis:"JP", a:["J","Your weekend feels best when you know the plan ahead.","Your week feels best when it's mapped out in advance."],
              b:["P","Your weekend feels best when you can go with the flow.","Your week feels best when it's open and flexible."]},
  {axis:"JP", a:["J","When you have a project, you usually start it right away.","With deadlines, you finish well ahead."],
              b:["P","When you have a project, you usually start closer to when it's due.","With deadlines, you hit your stride near the wire."]},
  {axis:"JP", a:["J","Your space is more often tidy and organized.","Your space tends to be organized."],
              b:["P","Your space is more often a creative kind of mess.","Your space tends to be comfortably chaotic."]},
  {axis:"JP", a:["J","On a trip, you'd rather follow a schedule of fun things.","Traveling, you prefer to plan an itinerary."],
              b:["P","On a trip, you'd rather see where the day takes you.","Traveling, you prefer to improvise as you go."]},
  {axis:"JP", a:["J","A to-do list makes you feel calm and in control.","A to-do list makes you feel calm and in control."],
              b:["P","A to-do list makes you feel a little boxed in.","A to-do list makes you feel a little boxed in."]},
  {axis:"JP", a:["J","Plans changing at the last minute throws you off.","A last-minute change of plans feels disruptive."],
              b:["P","Plans changing at the last minute is totally fine, maybe even exciting.","A last-minute change of plans feels fine, even fun."]},
  {axis:"JP", a:["J","You'd rather finish one thing fully before starting the next.","You'd rather finish one task before the next."],
              b:["P","You'd rather have a few things going at once.","You'd rather juggle several at once."]}
];

const INTERESTS = ["Gaming","Books","Movies","Anime","Theater","Coding","Music","Crafts","Travel","Sports","Art/Drawing","Cooking/Baking","Animals & Pets","Board games/D&D"];
const COHORTS = ["Aurora","Cascade","Harbor","Meadow","Summit","Wildwood"];
const TIMEZONES = [
  ["-10","Hawaii (UTC-10)"],["-8","Pacific (UTC-8)"],["-7","Mountain (UTC-7)"],["-6","Central (UTC-6)"],
  ["-5","Eastern (UTC-5)"],["-4","Atlantic / Caracas (UTC-4)"],["-3","Argentina / Brazil east (UTC-3)"],
  ["0","UK / Portugal (UTC+0)"],["1","Central Europe (UTC+1)"],["2","Eastern Europe (UTC+2)"],
  ["3","Moscow / East Africa (UTC+3)"],["4","Gulf (UTC+4)"],["5.5","India (UTC+5:30)"],
  ["7","Bangkok / Jakarta (UTC+7)"],["8","China / Singapore (UTC+8)"],["9","Japan / Korea (UTC+9)"],
  ["10","Sydney (UTC+10)"],["12","New Zealand (UTC+12)"]
];

/* ---------- State ---------- */
const state = {
  step:'landing',
  basics:{firstName:"",email:"",band:"",cohort:"",tz:""},
  answers:Array(Q.length).fill(null),
  qIndex:0,
  interests:new Set(),
  otherInterest:"",
  prefs:{joinGroupChat:""},
  result:null
};

const card = document.getElementById('card');
const fill = document.getElementById('fill');
const plabel = document.getElementById('plabel');

function progress(){
  const denom = Q.length + 2; // 28 q's + interests + prefs
  let done = 0, label = "Let's begin";
  if(state.step==='quiz'){ done = state.qIndex; label = `Question ${state.qIndex+1} of ${Q.length}`; }
  else if(state.step==='interests'){ done = Q.length; label = "Your interests"; }
  else if(state.step==='prefs'){ done = Q.length+1; label = "Almost done"; }
  else if(state.step==='reveal'){ done = denom; label = "All done!"; }
  fill.style.width = Math.round((done/denom)*100)+"%";
  plabel.textContent = label;
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

function render(){
  card.innerHTML="";
  ({landing:renderLanding, quiz:renderQuiz, interests:renderInterests, prefs:renderPrefs, reveal:renderReveal})[state.step]();
  progress();
  card.querySelector('input,select,button,[tabindex]')?.focus();
}

function renderLanding(){
  const b=state.basics;
  const node=el(`<div>
    <div class="step-count">Welcome, learner</div>
    <h2>Let's find your animal</h2>
    <p class="lede">First, a few quick things about you. The whole thing takes about five minutes, and there are no wrong answers, promise.</p>
    <label class="field"><span class="lab">First name</span><input type="text" id="fn" value="${b.firstName}" autocomplete="given-name" placeholder="Just your first name"></label>
    <label class="field"><span class="lab">Prisma email</span><input type="email" id="em" value="${b.email}" autocomplete="email" placeholder="you@prisma..."></label>
    <label class="field"><span class="lab">Which school are you in?</span>
      <select id="bd">
        <option value="">Choose one…</option>
        <option value="LS" ${b.band==='LS'?'selected':''}>Lower School (4-5)</option>
        <option value="MS" ${b.band==='MS'?'selected':''}>Middle School (6-8)</option>
        <option value="HS" ${b.band==='HS'?'selected':''}>High School (9-12)</option>
      </select></label>
    <label class="field"><span class="lab">Your cohort</span>
      <select id="ch"><option value="">Choose one…</option>${COHORTS.map(c=>`<option ${b.cohort===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="field"><span class="lab">Your time zone</span>
      <select id="tz"><option value="">Choose one…</option>${TIMEZONES.map(([v,l])=>`<option value="${v}" ${b.tz===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div class="err" id="err" hidden></div>
    <div class="nav"><span></span><button class="btn btn-primary" id="start">Start the quiz →</button></div>
  </div>`);
  card.append(node);
  node.querySelector('#start').onclick=()=>{
    b.firstName=node.querySelector('#fn').value.trim();
    b.email=node.querySelector('#em').value.trim();
    b.band=node.querySelector('#bd').value; b.cohort=node.querySelector('#ch').value; b.tz=node.querySelector('#tz').value;
    const err=node.querySelector('#err');
    if(!b.firstName||!b.email||!b.band||!b.cohort||!b.tz){ err.textContent="Please fill in everything so your coaches can find your matches."; err.hidden=false; return; }
    if(!/^\S+@\S+\.\S+$/.test(b.email)){ err.textContent="That email doesn't look quite right ,  mind checking it?"; err.hidden=false; return; }
    state.step='quiz'; state.qIndex=0; render();
  };
}

function renderQuiz(){
  const i=state.qIndex, q=Q[i];
  const idx = state.basics.band==='HS' ? 2 : 1;
  const node=el(`<div>
    <div class="step-count">Question ${i+1} of ${Q.length}</div>
    <div class="q-stem">Which feels more like you?</div>
    <p class="lede">Go with your gut. Pick the one that fits most days.</p>
    <div class="choices">
      <button class="choice" id="opta"><span class="pip"></span><span>${q.a[idx]}</span></button>
      <button class="choice" id="optb"><span class="pip"></span><span>${q.b[idx]}</span></button>
    </div>
    <div class="nav"><button class="btn btn-ghost" id="back">← Back</button><span></span></div>
  </div>`);
  card.append(node);
  const pick=(pole)=>{ state.answers[i]=pole; if(i+1<Q.length){ state.qIndex++; } else { state.step='interests'; } render(); };
  node.querySelector('#opta').onclick=()=>pick(q.a[0]);
  node.querySelector('#optb').onclick=()=>pick(q.b[0]);
  node.querySelector('#back').onclick=()=>{ if(i===0){ state.step='landing'; } else { state.qIndex--; } render(); };
}

function renderInterests(){
  const node=el(`<div>
    <div class="step-count">Your interests</div>
    <h2>What are you into?</h2>
    <p class="lede">Pick as many as you like. It helps us find learners who love the same stuff you do.</p>
    <div class="chips">${INTERESTS.map(t=>`<button class="chip" data-t="${t}" aria-pressed="${state.interests.has(t)}">${t}</button>`).join('')}</div>
    <label class="field" style="margin-top:20px"><span class="lab">Something else? Type it in</span>
      <input type="text" id="other" value="${state.otherInterest}" placeholder="e.g. skateboarding, K-pop, robotics"></label>
    <div class="nav"><button class="btn btn-ghost" id="back">← Back</button><button class="btn btn-primary" id="next">Next →</button></div>
  </div>`);
  card.append(node);
  node.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=c.dataset.t;
    if(state.interests.has(t)){state.interests.delete(t);c.setAttribute('aria-pressed','false');}
    else{state.interests.add(t);c.setAttribute('aria-pressed','true');}
  });
  node.querySelector('#back').onclick=()=>{ state.step='quiz'; state.qIndex=Q.length-1; render(); };
  node.querySelector('#next').onclick=()=>{ state.otherInterest=node.querySelector('#other').value.trim(); state.step='prefs'; render(); };
}

function renderPrefs(){
  const p=state.prefs;
  const node=el(`<div>
    <div class="step-count">One last thing</div>
    <h2>Your animal's group chat</h2>
    <p class="lede">Each animal has its own group chat. Want us to add you so you can meet the other learners who share your animal?</p>
    <div class="seg" data-name="joinGroupChat">
      <button type="button" data-v="yes" aria-pressed="${p.joinGroupChat==='yes'}">Yes, add me!</button>
      <button type="button" data-v="no" aria-pressed="${p.joinGroupChat==='no'}">Not right now</button>
    </div>
    <div class="err" id="err" hidden></div>
    <div class="nav"><button class="btn btn-ghost" id="back">← Back</button><button class="btn btn-primary" id="finish">See my animal ✦</button></div>
  </div>`);
  card.append(node);
  node.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    p.joinGroupChat=b.dataset.v;
    node.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
  });
  node.querySelector('#back').onclick=()=>{ state.step='interests'; render(); };
  node.querySelector('#finish').onclick=()=>{
    const err=node.querySelector('#err');
    if(!p.joinGroupChat){ err.textContent="Please pick yes or no to continue."; err.hidden=false; return; }
    state.result=computeResult(); state.step='reveal'; render(); submit();
  };
}

function computeResult(){
  const tally={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  state.answers.forEach(p=>{ if(p) tally[p]++; });
  const type=(tally.E>=tally.I?'E':'I')+(tally.S>=tally.N?'S':'N')+(tally.T>=tally.F?'T':'F')+(tally.J>=tally.P?'J':'P');
  return {type, animal:TYPE_MAP[type], scores:tally};
}

function renderReveal(){
  const {animal}=state.result; const A=ANIMALS[animal];
  const avatar=A.img?`<img src="${A.img}" alt="${animal}" style="width:100%;height:100%;object-fit:cover">`:A.emoji;
  const node=el(`<div class="reveal" style="--accent:var(${A.v})">
    <div class="badge">${avatar}</div>
    <div class="you-are">You are the</div>
    <h1>${animal}</h1>
    <div class="func">${A.fn}</div>
    <p class="desc">${A.desc}</p>
    <p class="desc" style="margin-top:12px;font-weight:700;color:var(--accent)">${A.note}</p>
    <div class="power-tag">✦ Your Prisma Power shines as ${A.power}</div>
    <div class="opp">Your balancing opposite is the <strong>${A.opp}</strong>, a learner who stretches you in the best way.</div>
    <div><a class="learn-btn" href="${ANIMAL_LINKS[animal]}" target="_blank" rel="noopener noreferrer">Want to learn more about the ${animal}?</a></div>
    <div class="done-note" id="note">Saving your result…</div>
  </div>`);
  card.append(node);
}

/* ---------- Submit ---------- */
function buildPayload(){
  const tzLabel=(TIMEZONES.find(t=>t[0]===state.basics.tz)||["",""])[1];
  return {
    firstName:state.basics.firstName, email:state.basics.email,
    band:state.basics.band, cohort:state.basics.cohort,
    timezoneOffset:state.basics.tz, timezoneLabel:tzLabel,
    type:state.result.type, animal:state.result.animal, axisScores:state.result.scores,
    interests:[...state.interests].concat(state.otherInterest?["Other: "+state.otherInterest]:[]),
    joinGroupChat:state.prefs.joinGroupChat==='yes',
    submittedAt:new Date().toISOString()
  };
}
async function submit(){
  const note=()=>document.getElementById('note');
  const payload=buildPayload();
  if(!CONFIG.ENDPOINT_URL){
    if(note()) note().innerHTML="✓ Preview mode. Your result isn't saved yet. Once the Google setup is done, this quietly saves to your coaches' sheet.";
    return;
  }
  try{
    await fetch(CONFIG.ENDPOINT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if(note()) note().innerHTML="✓ All set! Your coaches will help you find your matches soon.";
  }catch(e){
    if(note()) note().innerHTML="We couldn't save your result just now. Please let your coach know.";
  }
}

document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const p=card.querySelector('.btn-primary'); if(p && document.activeElement.tagName!=='BUTTON'){ p.click(); } } });

render();
</script>
</body>
</html>
